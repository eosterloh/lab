[project]
name = "lab"
version = "0.2.0"
description = "Eval → Research → Train harness for local model experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
train = ["torch"]
data = ["datasets"]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools.package-data]
lab = ["train/corpus.txt", "data/frozen_eval/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
